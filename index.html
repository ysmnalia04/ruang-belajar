<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruang Belajar Matematika</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="window.__math&&window.__math()"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" onload="window.__chart&&window.__chart()"></script>
<script>
  /* ================= PENGATURAN =================
     Tempel URL Web app Apps Script (berakhiran /exec). */
  const API_URL = "https://script.google.com/macros/s/AKfycbyjSBpKDKk7rxmLKzVw9QeE1QLlzwHaV3cO8YYOeIbCZuTS7CZj4zAgNUP0_cZJMzhZ/exec";
  const NAMA_MAPEL = "Matematika";
  const NAMA_GURU = "Yasmin Aulia, S.Pd";
</script>
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#141C2E; --muted:#5C6579; --rule:#E0E4ED;
  --acc:#2A4BA0; --soft:#E8EEFB; --deep:#1B2F6B; --mark:#FFD84D; --ok:#1E7A50; --oksoft:#E3F3EA; --danger:#B3261E; --onacc:#FFFFFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E131D; --surface:#161D2A; --ink:#E8ECF4; --muted:#9AA3B5; --rule:#273146;
    --acc:#8FA9F0; --soft:#1D2843; --deep:#17254F; --mark:#E8C547; --ok:#7CCFA3; --oksoft:#173126; --danger:#F2867E; --onacc:#0E131D; color-scheme:dark}
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
h1{font-size:clamp(1.55rem,4vw,2.1rem);letter-spacing:-.025em;margin:0 0 6px;line-height:1.15;font-weight:800}
h2{font-size:1.18rem;letter-spacing:-.015em;margin:0;font-weight:700}
h3{font-size:1.02rem;margin:0 0 6px}

/* grid paper */
.grid{background-color:var(--deep);color:#fff;position:relative;overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:24px 24px}
.formula{position:absolute;right:-8px;top:34%;font-size:clamp(3.5rem,10vw,7rem);font-weight:800;letter-spacing:-.04em;opacity:.08;white-space:nowrap;pointer-events:none;line-height:1}
.grid > *:not(.formula){position:relative}

/* buttons & forms */
.btn{appearance:none;font:inherit;font-weight:700;font-size:.93rem;cursor:pointer;border-radius:12px;padding:11px 20px;border:1px solid var(--acc);background:var(--acc);color:var(--onacc);text-decoration:none;display:inline-block;line-height:1.3}
.btn:hover{filter:brightness(1.07)}
.btn.quiet{background:var(--surface);border-color:var(--rule);color:var(--ink)}
.btn.small{padding:7px 13px;font-size:.85rem;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:wait}
.linkbtn{appearance:none;background:none;border:none;font:inherit;color:var(--acc);font-weight:600;cursor:pointer;padding:0}
form.stack,.stack{display:grid;gap:18px;max-width:680px}
label{display:grid;gap:6px;font-size:.92rem;font-weight:600}
.hint{font-weight:400;color:var(--muted);font-size:.83rem}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:11px 13px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent;background:var(--surface)}
fieldset{border:none;padding:0;margin:0}
legend{font-size:.92rem;font-weight:600;margin-bottom:8px}
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale label{display:block;position:relative}
.scale input{position:absolute;opacity:0;width:1px;height:1px}
.scale span{display:grid;place-items:center;min-width:92px;padding:9px 10px;border:1px solid var(--rule);border-radius:12px;font-weight:500;font-size:.82rem;cursor:pointer;text-align:center;background:var(--surface)}
.scale span b{font-size:1.15rem;display:block}
.scale input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.scale input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.notice{border-left:4px solid var(--mark);background:var(--surface);padding:12px 14px;border-radius:0 12px 12px 0;margin:0 0 18px;font-size:.93rem;max-width:72ch}
.empty{color:var(--muted);padding:26px;border:1.5px dashed var(--rule);border-radius:16px;text-align:center;background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:22px}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.login .hero{padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh}
.login .hero .logo{border:1px solid rgba(255,255,255,.3)}
.login .hero .tag{font-weight:600;opacity:.85;font-size:.95rem}
.login .hero h1{font-size:clamp(2.8rem,7vw,5rem);line-height:.95;letter-spacing:-.045em;margin:0 0 14px;color:#fff}
.login .hero .guru{font-size:1.05rem;opacity:.92;margin:0}
.login .hero .guru b{background:linear-gradient(transparent 60%,rgba(255,216,77,.45) 60%)}
.login .side{display:grid;place-items:center;padding:32px 24px;background:var(--surface)}
.login .box{width:min(380px,100%)}
@media (max-width:820px){.login{grid-template-columns:1fr}.login .hero{min-height:auto;padding:32px 24px 40px;gap:40px}.login .side{align-items:start}}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--rule)}
.topin{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:10px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:1.1rem;background-size:8px 8px}
.brand b{display:block;font-size:.98rem;line-height:1.2}
.brand span{display:block;font-size:.8rem;color:var(--muted)}
.ava{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none}
.me{font-size:.9rem;font-weight:600;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.me{display:none}}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs a{padding:10px 14px 12px;text-decoration:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--acc);border-bottom-color:var(--acc)}
main.wrap{padding-top:26px;padding-bottom:70px}

/* banner */
.banner .formula{top:auto;bottom:-14px;font-size:clamp(3rem,8vw,5.5rem);opacity:.07}
.banner{border-radius:22px;padding:30px 30px 28px;margin-bottom:26px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.banner h1{color:#fff;font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 6px}
.banner p{margin:0;opacity:.88;max-width:46ch}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px 16px;min-width:210px;backdrop-filter:blur(2px)}
.stat .n{font-size:1.6rem;font-weight:800;line-height:1}
.stat .l{font-size:.82rem;opacity:.85;margin-top:2px}
.prog{height:7px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mark);border-radius:99px}

/* bab card */
.bab{background:var(--surface);border:1px solid var(--rule);border-radius:20px;overflow:hidden;margin-bottom:22px}
.babhead{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--rule)}
.babhead .n{font-weight:700;font-size:.8rem;color:var(--acc);background:var(--soft);padding:4px 10px;border-radius:99px;white-space:nowrap}
.plist{list-style:none;margin:0;padding:6px 0}
.prow{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;padding:12px 22px}
.prow + .prow{border-top:1px solid var(--rule)}
.pmain{text-decoration:none;color:inherit;min-width:0}
.pmain:hover .ptitle{color:var(--acc)}
.pnum{text-decoration:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.act{font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);text-decoration:none;white-space:nowrap}
.act:hover{border-color:var(--acc);color:var(--acc)}
.act.ok{background:var(--oksoft);border-color:transparent;color:var(--ok)}
.act.todo{border-color:var(--acc);color:var(--acc)}
.pnum{width:46px;height:46px;border-radius:13px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:1.2rem}
.ptitle{font-weight:700;line-height:1.35}
.ptuj{color:var(--muted);font-size:.87rem;margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
.chip.ok{background:var(--oksoft);color:var(--ok)}
.chip.plain::before{display:none}
.chev{color:var(--muted);font-size:1.3rem;line-height:1}
@media (max-width:640px){.prow{grid-template-columns:42px 1fr;padding:12px 16px}.pnum{width:42px;height:42px}.acts{grid-column:2;justify-content:flex-start}.babhead{padding:16px}}
.babend{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 22px 20px;background:var(--bg);border-top:1px solid var(--rule)}
@media (max-width:640px){.banner{padding:24px 20px}.stat{width:100%}}
@media (max-width:640px){.babend{grid-template-columns:1fr;padding:12px 16px 16px}}
.tile{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:13px 15px}
.tile:hover{border-color:var(--acc)}
.tile .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--acc);flex:none}
.tile .tt{font-weight:700;font-size:.95rem}
.tile .ts{color:var(--muted);font-size:.84rem}

/* page */
.back{display:inline-block;margin-bottom:16px;font-weight:600;text-decoration:none;font-size:.92rem}
.kick{color:var(--acc);font-size:.88rem;font-weight:600;margin:0 0 6px}
.subtabs{display:inline-flex;gap:4px;margin:18px 0 24px;padding:4px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;flex-wrap:wrap}
.subtabs a{padding:8px 16px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem}
.subtabs a[aria-current="page"]{background:var(--acc);color:var(--onacc)}
.isi{max-width:68ch;font-size:1.02rem}
.isi p{margin:0 0 14px;white-space:pre-wrap}
.tujuan{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--mark);border-radius:0 14px 14px 0;padding:14px 16px;margin-bottom:22px;max-width:68ch}
.tujuan b{display:block;font-size:.82rem;color:var(--muted);margin-bottom:2px}
.links{display:grid;gap:8px;margin-top:8px}
.links a{display:block;padding:11px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;text-decoration:none;font-weight:600}
.links a:hover{border-color:var(--acc)}

/* soal */
.soal{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:20px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;margin-bottom:12px}
.sn{width:32px;height:32px;border-radius:9px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:800}
.sq{white-space:pre-wrap;margin-bottom:12px;font-weight:500}
.soal img{max-width:100%;border-radius:12px;border:1px solid var(--rule);margin-bottom:12px}
.opsi{display:grid;gap:8px}
.opsi label{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--rule);border-radius:12px;cursor:pointer;font-weight:500;background:var(--bg)}
.opsi input{width:auto;margin:4px 0 0;accent-color:var(--acc)}
.opsi label:has(input:checked){border-color:var(--acc);background:var(--soft)}
.opsi label.kunci{border-color:var(--ok);background:var(--oksoft)}
.opsi label.salah{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.fb{font-weight:600;font-size:.9rem;margin:10px 0 0}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--danger)}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score .v{font-size:3.2rem;font-weight:800;line-height:1;color:var(--acc);letter-spacing:-.04em}
.timerbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 18px -12px rgba(20,28,46,.35)}
#timer{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}
#timer.mepet{color:var(--danger)}

/* tables, nilai, portfolio */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--bg)}
tr:last-child td{border-bottom:none}
td.num{font-variant-numeric:tabular-nums;font-weight:600}
.ngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.nbox{background:var(--bg);border-radius:14px;padding:13px 15px}
.nbox .l{font-size:.78rem;color:var(--muted)}
.nbox .v{font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
.nbox.hi{background:var(--acc);color:var(--onacc)} .nbox.hi .l{color:inherit;opacity:.85}
.stud{border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:var(--surface);margin-bottom:12px}
.stud .sh{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}
.stud ul{list-style:none;margin:0;padding:0}
.stud li{padding:13px 16px;border-top:1px solid var(--rule)}
.stud li:first-child{border-top:none}
.stud p{margin:3px 0 0;font-size:.92rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:.92rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}

/* ===== tambahan: tes, guru, grafik ===== */
.babtes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 22px;background:var(--bg);border-bottom:1px solid var(--rule)}
@media (max-width:640px){.babtes{grid-template-columns:1fr;padding:12px 16px}}
.tile .ic{font-size:.72rem}
.tile.hot{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.kelsel{width:auto;padding:7px 10px;font-weight:600;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px 18px}
.kpi .v{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .l{font-size:.82rem;color:var(--muted)}
.kpi.main{background:var(--deep);color:#fff;border-color:transparent}
.kpi.main .l{color:rgba(255,255,255,.8)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.charts .wide{grid-column:1/-1}
@media (max-width:860px){.charts{grid-template-columns:1fr}}
.chartcard h3{margin:0 0 2px}
.chartbox{position:relative;height:270px;margin-top:12px}
.small{font-size:.85rem}
.ngl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.scard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px;text-decoration:none;color:inherit}
.scard:hover{border-color:var(--acc)}
.scard .ava{width:42px;height:42px;font-size:.9rem}
.scard b{display:block;line-height:1.3}
.scard span.s{font-size:.8rem;color:var(--muted)}
.bigava{width:64px;height:64px;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.4rem;flex:none}
.pp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ppc{background:var(--bg);border-radius:14px;padding:14px 16px}
.ppc .t{font-weight:700;margin-bottom:6px}
.ppc .arrow{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.ppc .arrow span{color:var(--muted);font-weight:500;font-size:1rem;margin:0 6px}
.sec{margin-top:16px}
.sec > h2{margin-bottom:12px}
details.priv{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px 18px;margin-top:16px}
details.priv summary{cursor:pointer;font-weight:700}
.reflitem{border-top:1px solid var(--rule);padding:12px 0}
.reflitem p{white-space:pre-wrap;margin:6px 0 0;font-size:.93rem}
.search{max-width:320px}
.hide-m{}
@media (max-width:640px){.hide-m{display:none}}
html.present body{zoom:1.12}
.previewnote{background:var(--soft);color:var(--acc);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem;margin-bottom:16px}

/* ===== game ===== */
.act.game{border-color:var(--mark);background:color-mix(in srgb,var(--mark) 22%,var(--surface))}
.gm-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.gm-card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.gm-card h3{margin:0}
.gm-card .btn{align-self:flex-start}
.gm-ikon{width:48px;height:48px;border-radius:14px;background:var(--deep);color:var(--mark);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.gm-ikon.besar{width:64px;height:64px;font-size:1.2rem;margin:0 auto}
.papan{border-top:1px solid var(--rule);padding-top:10px;margin-top:auto}
.papan .ph{font-size:.78rem;font-weight:700;color:var(--muted)}
.papan ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.papan li{display:flex;gap:8px;align-items:center;font-size:.88rem}
.papan .rk{width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-size:.72rem;font-weight:800;flex:none}
.papan li:first-child .rk{background:var(--mark);color:#3a2e00}
.papan .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-area{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:18px}
.gm-hasil{text-align:center;display:grid;gap:12px;justify-items:center;padding:12px 0}
.gm-info{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gm-info span{font-size:.82rem;font-weight:700;background:var(--bg);border-radius:99px;padding:4px 10px}
.gm-info span:empty{display:none}
.gm-board{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  if(!j.ok){ const er=new Error(j.error||"Terjadi kesalahan."); er.server=true; throw er; }

}
async function muatKelas(){
